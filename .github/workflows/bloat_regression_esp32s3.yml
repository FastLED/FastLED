name: bloat regression esp32s3

# Asserts that `bash bloat esp32s3` image_flash equals the pinned
# baseline in tests/data/esp32s3_bloat_baseline.txt, within build noise.
# The baseline is a ratchet and it moves in BOTH directions: a PR that
# lands a saving must re-pin it down, and a PR whose cost is intentional
# may re-pin it up with the reason written into that file as a comment.
# Either way the file ends the PR equal to what the PR builds.
#
# Unclaimed headroom fails too. Leaving a saving unpinned is how 232 B
# of slack accumulated before #4200 and made a 429 B cost print as
# 197 B; the gate says so rather than passing quietly.
#
# See FastLED #2886 (Stage 6) and #4200. The path filters mirror
# build_esp32s3.yml so the gate runs on the same set of touch points
# that could plausibly affect ESP32-S3 flash.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/platforms/arm/**'
      - '!src/platforms/wasm/**'
      - '!src/platforms/avr/**'
      - 'src/platforms/esp/**'
      - 'examples/**'
      - 'ci/**'
      - 'tests/data/esp32s3_bloat_baseline.txt'
      - 'tests/test_esp32s3_bloat_regression.py'
      - '.github/workflows/bloat_regression_esp32s3.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
# Checkout and artifact upload need nothing beyond reading the repository.
permissions:
  contents: read

jobs:
  bloat_regression:
    name: bloat regression
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-test:bloat') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32s3') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*')))
    runs-on: ubuntu-latest
    # Hard-block external-fork pull requests (mirrors build_esp32s3.yml policy
    # — see #2757).
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The gate compares the baseline against its merge-base version, so
          # a raise without a recorded reason can be caught. A shallow clone
          # has no merge base to read.
          fetch-depth: 0

      # Same path classification as the memory report (ci/changed_targets.py):
      # an ESP8266-only or stub/WASM-only push cannot move the ESP32-S3 image,
      # so the gate reports success without building. An explicit label always
      # runs it, and `ci-full` already selects this job.
      - name: Decide whether this change can affect ESP32-S3
        id: relevance
        env:
          LABELS: ${{ github.event_name == 'workflow_dispatch' && '[]' || toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          labels="$(jq -r 'join(",")' <<<"$LABELS")"
          case ",$labels," in
            *,ci-full,*|*,ci-test:bloat,*|*,ci-platform:esp32s3,*|*,ci-platform:esp\*,*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "ESP32-S3 bloat gate selected by label." >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          if [ "$DISPATCH" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > changed.txt
          if [ -n "$BASE_SHA" ]; then
            base="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
            git diff --name-only "$base" "$HEAD_SHA" > changed.txt
          elif git rev-parse --verify --quiet "$HEAD_SHA~1" >/dev/null; then
            git diff --name-only "$HEAD_SHA~1" "$HEAD_SHA" > changed.txt
          fi
          if python3 ci/changed_targets.py --changed-file changed.txt --affects esp32; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping the ESP32-S3 bloat gate: the change cannot affect ESP32." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up uv (Python toolchain)
        if: steps.relevance.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'schedule') }}
          enable-cache: true

      - name: Sync project dependencies
        if: steps.relevance.outputs.run == 'true'
        run: uv sync

      - name: Recover the baseline as it stands on the merge base
        if: steps.relevance.outputs.run == 'true'
        id: previous_baseline
        run: |
          set -euo pipefail
          # For a pull request the comparison point is the merge base, not
          # the target-branch tip: `base.sha` moves whenever master advances,
          # so comparing against a newer tip would read someone else's change
          # to the baseline as this PR's. A push has no merge to take, so its
          # comparison point is the previous commit.
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            base="$(git merge-base "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}" || true)"
          else
            base="${{ github.event.before }}"
          fi
          out="$RUNNER_TEMP/previous_baseline.txt"
          if [ -n "$base" ] && git cat-file -e "$base:tests/data/esp32s3_bloat_baseline.txt" 2>/dev/null; then
            git show "$base:tests/data/esp32s3_bloat_baseline.txt" > "$out"
            echo "path=$out" >> "$GITHUB_OUTPUT"
          else
            # No merge base to compare against (first commit, or a force push
            # that dropped it). The reason check is skipped rather than
            # guessed at; the size gate below still runs.
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ESP32-S3 bloat regression gate
        if: steps.relevance.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ -n "${{ steps.previous_baseline.outputs.path }}" ]; then
            uv run python tests/test_esp32s3_bloat_regression.py \
              --previous-baseline "${{ steps.previous_baseline.outputs.path }}"
          else
            uv run python tests/test_esp32s3_bloat_regression.py
          fi

      # The slim profile is an explicit opt-in build, reported separately
      # under .build/symbols/esp32s3-slim so it never touches the baseline
      # above. The step fails if the slim knobs did not take effect.
      - name: Slim profile smoke (explicit opt-in profile)
        if: steps.relevance.outputs.run == 'true'
        run: uv run ci/bloat.py esp32s3 --example Blink --build --profile slim --top 25

      # The gate's total is a sum over this report, and a local run of the same
      # commit has been seen to disagree with it by 4 KB (#4468). Keeping the
      # report lets a local build be diffed against CI's symbol by symbol
      # instead of rebuilt and guessed at. Uploaded on failure too: that is
      # when it is needed most.
      - name: Upload the symbol report
        if: always() && steps.relevance.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-bloat-report
          path: |
            .build/symbols/esp32s3/report.json
            .build/symbols/esp32s3/report.md
            .build/symbols/esp32s3/provenance.json
            .build/symbols/esp32s3-slim/report.json
            .build/symbols/esp32s3-slim/report.md
            .build/symbols/esp32s3-slim/provenance.json
          if-no-files-found: warn
          retention-days: 30
