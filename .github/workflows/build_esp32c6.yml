name: esp32c6

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/platforms/arm/**'
      - '!src/platforms/wasm/**'
      - '!src/platforms/avr/**'
      - 'src/platforms/esp/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_esp32c6.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  reserve-runner:
    name: Reserve build runner
    if: ${{ github.event_name == 'workflow_dispatch' && vars.FORGE_POOL_LEASE_CLASS != '' && vars.FORGE_POOL_LABELS != '' }}
    runs-on: ${{ vars.FORGE_QUICK_LABELS != '' && fromJSON(vars.FORGE_QUICK_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 2
    permissions:
      id-token: write
    outputs:
      runs-on: ${{ steps.reserve.outputs.runs-on }}
    steps:
      - id: reserve
        uses: forge-ci/ci.yml/actions/pool-select@ed73926bc2de1b5d71f50907cd93920daeecbe78
        with:
          source: lease
          labels: ${{ vars.FORGE_POOL_LABELS }}
          fallback: ubuntu-24.04
          lease-class: ${{ vars.FORGE_POOL_LEASE_CLASS }}
          lease-job: build

  build:
    needs: reserve-runner
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32c6') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*'))))
    uses: ./.github/workflows/build_template.yml
    with:
      args: esp32c6 all
      reserved-runs-on: ${{ needs.reserve-runner.outputs.runs-on }}
