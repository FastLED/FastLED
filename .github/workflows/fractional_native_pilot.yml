name: fractional native pilot

# Manual measurement lane for FastLED#4543. The existing native CI matrix
# remains authoritative until whole-event cost and full coverage are proven.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          version: '0.8.0'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          ./install
      - name: Build shared FastLED and run unit and example suites
        run: |
          bash test --cpp --build-mode debug-thin --clang --verbose
          test -f .build/meson-debug-thin/ci/meson/native/fastled.so
