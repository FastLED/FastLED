name: clearcore_same53

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/Blink/**'
      - 'ci/**'
      - '.github/workflows/build_clearcore.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:clearcore')))
    uses: ./.github/workflows/build_template.yml
    with:
      # Compile-only coverage against Teknic's ClearCore Arduino core.
      # fbuild support must land and be released before this workflow does.
      args: clearcore Blink
      fbuild_version: "2.5.19"
      prefer_setup_fbuild: true
