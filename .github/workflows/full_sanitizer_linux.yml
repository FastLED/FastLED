name: full sanitizer linux

on:
  workflow_dispatch:
  # GitHub cron uses UTC. Check local hour below to run at 03:00 Pacific
  # through both daylight-saving and standard time.
  schedule:
    - cron: '0 10,11 * * *'

permissions:
  contents: read

jobs:
  recent-change:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.check.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        run: |
          if [[ '${{ github.event_name }}' == workflow_dispatch ]]; then
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(TZ=America/Los_Angeles date +%H)" != 03 ]]; then
            echo 'run_full=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$(git log -1 --since='24 hours ago' --format=%H)" ]]; then
            echo 'run_full=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run_full=false' >> "$GITHUB_OUTPUT"
          fi

  unit:
    needs: recent-change
    if: needs.recent-change.outputs.run_full == 'true'
    uses: ./.github/workflows/template_unit_test.yml
    with:
      os: ubuntu-latest
      build-mode: debug

  examples:
    needs: recent-change
    if: needs.recent-change.outputs.run_full == 'true'
    uses: ./.github/workflows/template_example_test.yml
    with:
      os: ubuntu-latest
      build-mode: debug
