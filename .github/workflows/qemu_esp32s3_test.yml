name: ESP32-S3 QEMU Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      - 'examples/**/*.ino'
      - 'examples/**/*.cpp'
      - 'examples/**/*.h'
      - 'ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CMakeLists.txt'
      - 'library.json'
      - 'library.properties'
      - '.github/workflows/qemu_esp32s3_test.yml'
      - '.github/workflows/qemu_template.yml'

permissions:
  contents: read

jobs:
  esp32s3_qemu_rmt:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-test:qemu*') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32s3') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*')))
    uses: ./.github/workflows/qemu_template.yml
    with:
      platform: esp32s3
      platform_display: ESP32-S3
      sketch: BlinkParallel
      success_pattern: Initialized 4 LED strips with 256 LEDs each

  esp32s3_qemu_lcd:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-test:qemu*') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32s3') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*')))
    uses: ./.github/workflows/qemu_template.yml
    with:
      platform: esp32s3
      platform_display: ESP32-S3
      sketch: SpecialDrivers/ESP/DriverTest
      extra_define: FL_QEMU_VALIDATE_LCD_CLOCKLESS
      success_pattern: 'QEMU_LCD_CLOCKLESS_REGISTRATION: PASS'
