name: attiny85_binary_size

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/check_attiny85.yml'
      - '.github/workflows/build_template_binary_size.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  build:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny85') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny*')))
    uses: ./.github/workflows/build_template_binary_size.yml
    with:
      board: attiny85
      max_size: 9500
      max_size_apa102: 12000

  build_no_forced_inline:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny85') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny*')))
    uses: ./.github/workflows/build_template_binary_size.yml
    with:
      board: attiny85
      max_size: -1
      max_size_apa102: -1
      extra_args: --defines FASTLED_NO_FORCE_INLINE
