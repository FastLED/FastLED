name: clone and compile

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_clone_and_compile.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  # pull_request_target: DISABLED - Security vulnerability through build pre-script execution
  # Running on pull_request_target allows execution of malicious Python code
  # Workflow still runs on push to master for validation

permissions:
  contents: read        # Required to checkout code
  actions: read         # Required for artifact operations  
  id-token: write      # Required for artifact upload (OIDC)
  pull-requests: read   # If needed to read PR info

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install uv

      - name: Set up fbuild (install + cache)
        uses: FastLED/fbuild/.github/actions/setup@main
        with:
          fbuild-version: latest
          cache-key-extra: clone-and-compile-${{ hashFiles('platformio.ini', 'library.json', 'pyproject.toml') }}

      # A fresh clone must build the root project as-is: every env in the
      # root platformio.ini goes through fbuild, the only board build backend.
      - name: Build root project with fbuild
        run: |
          set -euo pipefail
          for env in $(sed -nE 's/^\[env:([^]]+)\]/\1/p' platformio.ini); do
            echo "::group::fbuild build --environment $env"
            fbuild build --environment "$env"
            echo "::endgroup::"
          done
