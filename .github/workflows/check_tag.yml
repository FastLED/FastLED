# Fails when a pushed X.Y.Z tag names a version the tagged tree does not
# have, or when the release notes for it were never finalized. The tag is
# what the Arduino index packages; the tree is what the package registry's
# crawler publishes -- they must agree. See #4444.
#
# Guards hand-pushed tags. The automated release path (release.yml) creates
# its tag with the workflow token, which does not raise push events here --
# but that path already runs `release check --releasing` before tagging.

name: check_tag

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: check-tag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-tag:
    # workflow_dispatch can target a branch; only tag refs carry a version.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The check compares the tag against the tree at the tagged commit;
      # a shallow checkout of that one commit is all it reads. The tagged
      # tree's own code runs next, so the token stays out of .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        run: pip install uv==0.12.13

      - name: Check the tag names the tree's version
        run: PYTHONPATH=. uv run ci/release.py check-tag "${GITHUB_REF_NAME}"
