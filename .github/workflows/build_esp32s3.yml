name: esp32s3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/platforms/arm/**'
      - '!src/platforms/wasm/**'
      - '!src/platforms/avr/**'
      - 'src/platforms/esp/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_esp32s3.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  build:
    name: ESP32-S3 examples
    # Hard-block external-fork pull requests (no exceptions per #2757).
    # `github.event.pull_request == null` lets push / workflow_dispatch / etc.
    # pass; the equality clause only matches when the PR head repo IS the base.
    # One serial sweep, like every other board. The sweep was sharded (#3791,
    # #4165) while FastLED/fbuild#1411/#1413 made every sketch rebuild the
    # framework; that shipped fixed in fbuild 2.5.22, and each extra shard
    # duplicated ~5-8 minutes of framework + library warm-up on its own runner.
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32s3') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*')))
    uses: ./.github/workflows/build_template.yml
    with:
      # Opt-in board validation compiles the complete set on the requested SHA.
      args: esp32s3 all
