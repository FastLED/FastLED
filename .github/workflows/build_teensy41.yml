name: teensy41

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/platforms/esp/**'
      - '!src/platforms/wasm/**'
      - '!src/platforms/avr/**'
      - '!src/platforms/arm/rp2040/**'
      - '!src/platforms/arm/sam/**'
      - 'src/platforms/arm/k20/**'
      - 'src/platforms/arm/k66/**'
      - 'src/platforms/arm/kl26/**'
      - 'src/platforms/arm/mxrt1062/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_teensy41.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - '!src/platforms/esp/**'
      - '!src/platforms/wasm/**'
      - '!src/platforms/avr/**'
      - '!src/platforms/arm/rp2040/**'
      - '!src/platforms/arm/sam/**'
      - 'src/platforms/arm/k20/**'
      - 'src/platforms/arm/k66/**'
      - 'src/platforms/arm/kl26/**'
      - 'src/platforms/arm/mxrt1062/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_teensy41.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'

jobs:
  build:
    # Hard-block external-fork pull requests (no exceptions per #2757).
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build_template.yml
    with:
      # Pull requests compile the smoke set (tests/platforms/_standard/
      # SMOKE_SKETCHES.txt plus examples the PR changes); master compiles
      # every example (#4415).
      args: teensy41 ${{ github.event_name == 'pull_request' && 'smoke' || 'all' }}
