name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
  # Manual trigger so the cross-platform matrix can be exercised on a
  # feature branch before merge. The matrix is otherwise post-merge only
  # — useful for big refactors (e.g. #3444 bus enum migration) where the
  # contributor wants per-board signal before the breaking-swap lands on
  # master.
  workflow_dispatch:

  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  build_uno:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:uno')))
    uses: ./.github/workflows/build_template.yml
    with:
      args: "uno"

  build_esp32dev:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
