name: example tests macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - 'ci/examples/example_groups.py'
      - 'ci/meson/compile_tests/**'
      - '.github/workflows/example_test*.yml'
      - '.github/workflows/template_example_test.yml'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson.options'
      - 'examples/meson.build'
      - 'pyproject.toml'
      - 'test'
      - 'test.py'
  pull_request:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/example_test*.yml'
      - '.github/workflows/template_example_test.yml'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson.options'
      - 'examples/meson.build'
      - 'pyproject.toml'
      - 'test'
      - 'test.py'
jobs:
  test:
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/template_example_test.yml
    with:
      os: macos-latest
      build-mode: debug
      example-group: CompileTests
