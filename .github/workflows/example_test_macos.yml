name: example tests macos

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled, unlabeled]
jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'ci-full'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    uses: ./.github/workflows/template_example_test.yml
    with:
      os: ${{ matrix.os }}
      build-mode: debug
      example-group: CompileTests
