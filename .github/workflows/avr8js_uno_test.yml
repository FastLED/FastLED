name: uno AVR8JS Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'examples/**/*.ino'
      - 'examples/**/*.cpp'
      - 'examples/**/*.h'
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'library.json'
      - '.github/workflows/avr8js_uno_test.yml'
      - '.github/workflows/avr8js_docker_template.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  uno_avr8js_test:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-test:avr8js') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:uno')))
    uses: ./.github/workflows/avr8js_docker_template.yml
    with:
      platform: uno
      platform_display: Arduino Uno
      sketch: Test
