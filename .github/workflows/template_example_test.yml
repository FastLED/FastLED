name: example tests template

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: 'Runner OS (ubuntu-latest, macos-latest, or windows-latest)'
      build-mode:
        required: false
        type: string
        default: debug
        description: 'Native sanitizer preset (debug or Linux-only debug-thin)'
      example-group:
        required: false
        type: string
        default: CompileTests
        description: 'Example group to compile (CompileTests for the live gate)'

permissions:
  contents: read        # Required to checkout code
  actions: read         # Required for artifact operations
  pull-requests: read   # If needed to read PR info

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.os }}
    # Fail fast instead of waiting for the 6h default runner timeout.
    # Successful runs complete in ~8-20 minutes; anything past 45m is hung.
    # Observed Windows runners hanging in the Install step for 3+ hours
    # before losing communication with the server (runs/24593311481).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
          version: "0.8.0" # 0.8.8 has problems with deployment on linux.

      - name: Install libunwind-dev (Linux only)
        if: runner.os == 'Linux'
        # Refresh apt indexes before install so stale mirror metadata
        # (e.g. a transitional liblzma-dev version the mirror hasn't
        # propagated yet, returning 404) doesn't fail the build.
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev

      - name: Install
        run: ./install
        shell: bash

      - name: Compile ${{ inputs.example-group }}
        env:
          FASTLED_BUILD_MODE: ${{ inputs.build-mode }}
          FASTLED_EXAMPLE_GROUP: ${{ inputs.example-group }}
        run: |
          export PYTHONUNBUFFERED=1
          export PYTHONIOENCODING=utf-8
          if [[ "$RUNNER_OS" == Linux && "$FASTLED_EXAMPLE_GROUP" == CompileTests ]]; then
            export FASTLED_EXAMPLE_JOBS=2
          fi
          ./test --clang --examples --example-group "$FASTLED_EXAMPLE_GROUP" --verbose --build-mode "$FASTLED_BUILD_MODE"
          if [[ "$RUNNER_OS" == Linux ]]; then
            build_suffix=""
            if [[ "$FASTLED_EXAMPLE_GROUP" == CompileTests ]]; then
              build_suffix="-compile-tests"
            fi
            du -sb ".build/meson-${FASTLED_BUILD_MODE}${build_suffix}" | awk '{print "Build bytes: " $1}'
          fi
        shell: bash
