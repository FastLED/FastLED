name: unit tests linux

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: 'Native sanitizer preset (select debug for the full ASan backstop)'
        type: choice
        default: debug-thin
        options:
          - debug-thin
          - debug
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ci/**'
      - '.github/workflows/build_unit_test*.yml'
      - '.github/workflows/template_unit_test.yml'
      - 'CMakeLists.txt'
      - 'meson.build'
      - 'meson.options'
      - 'examples/meson.build'
      - 'pyproject.toml'
      - 'test'
      - 'test.py'
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  test:
    # Hard-block external-fork pull requests (no exceptions per #2757).
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/template_unit_test.yml
    with:
      os: ubuntu-latest
      build-mode: ${{ github.event_name == 'workflow_dispatch' && inputs.build-mode || 'debug-thin' }}
      full-suite: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}
