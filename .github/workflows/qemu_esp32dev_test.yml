name: ESP32-DEV QEMU Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      - 'examples/**/*.ino'
      - 'examples/**/*.cpp'
      - 'examples/**/*.h'
      - 'ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CMakeLists.txt'
      - 'library.json'
      - 'library.properties'
      - '.github/workflows/qemu_esp32dev_test.yml'
      - '.github/workflows/qemu_template.yml'

permissions:
  contents: read

jobs:
  esp32dev_qemu_test:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-test:qemu*') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp32dev') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:esp*')))
    uses: ./.github/workflows/qemu_template.yml
    with:
      platform: esp32dev
      platform_display: ESP32-DEV
      sketch: BlinkParallel
      success_pattern: Initialized 4 LED strips with 256 LEDs each
