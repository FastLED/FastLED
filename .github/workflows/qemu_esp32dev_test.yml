name: ESP32-DEV QEMU Test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      - 'examples/**/*.ino'
      - 'examples/**/*.cpp'
      - 'examples/**/*.h'
      - 'ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CMakeLists.txt'
      - 'library.json'
      - 'library.properties'
      - '.github/workflows/qemu_esp32dev_test.yml'
      - '.github/workflows/qemu_template.yml'
  push:
    branches: [master]
    paths:
      - 'src/**/*.cpp'
      - 'src/**/*.h'
      - 'src/**/*.hpp'
      - 'examples/**/*.ino'
      - 'examples/**/*.cpp'
      - 'examples/**/*.h'
      - 'ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'CMakeLists.txt'
      - 'library.json'
      - 'library.properties'
      - '.github/workflows/qemu_esp32dev_test.yml'
      - '.github/workflows/qemu_template.yml'

permissions:
  contents: read

jobs:
  esp32dev_qemu_test:
    uses: ./.github/workflows/qemu_template.yml
    with:
      platform: esp32dev
      platform_display: ESP32-DEV
      sketch: BlinkParallel
      success_pattern: Initialized 4 LED strips with 256 LEDs each
