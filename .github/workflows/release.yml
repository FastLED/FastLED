name: release

# A maintainer dispatches full CI for the exact candidate SHA, then manually
# runs this workflow. A version push alone cannot create a tag or release.
# This workflow turns a verified version on master into a tag and release:
#   - the tag is what the Arduino index picks up
#   - the package registry's crawler reads the version from library.json on
#     master, and packages the tag of the same name -- so the tag must exist
#     as soon as master shows the version
# Safe to re-run: an existing tag or release is left alone.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact master commit that passed the full CI dispatch sweep'
        required: true
        type: string
      dry_run:
        description: 'Verify release and full CI evidence without writing a tag'
        required: true
        default: true
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the tag and the release
  actions: write    # dispatch the docs build; also reads full CI evidence

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Release runs must use master."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the check compares against every release tag
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Require candidate is current master
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/master --jq .object.sha)" = "$CANDIDATE_SHA"

      - name: Install uv
        run: pip install uv==0.12.13

      - name: Verify exact candidate full CI
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: uv run python ci/release_gate.py verify --sha "$CANDIDATE_SHA"

      - name: Read the version on master
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          VERSION=$(sed -n 's/^version=//p' library.properties)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            test "$(git rev-parse "refs/tags/$VERSION^{}")" = "$CANDIDATE_SHA" || {
              echo "Existing version tag does not point at candidate SHA" >&2
              exit 1
            }
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to do
        if: steps.v.outputs.released == 'true'
        run: echo "${{ steps.v.outputs.version }} is already released."

      # An untagged version on master that is not a valid release fails here,
      # loudly: that is the state the registry crawler would publish as-is.
      - name: Check the tree is a valid release
        if: steps.v.outputs.released == 'false' && steps.v.outputs.tagged == 'false'
        run: PYTHONPATH=. uv run ci/release.py check --releasing

      - name: Extract the release notes
        if: steps.v.outputs.released == 'false'
        run: PYTHONPATH=. uv run ci/release.py notes "${{ steps.v.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      - name: Recheck remote master immediately before release
        if: inputs.dry_run == false && steps.v.outputs.released == 'false'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/master
          uv run python ci/release_gate.py require-master \
            --sha "$CANDIDATE_SHA" --observed "$(git rev-parse FETCH_HEAD)"

      - name: Tag and create the GitHub release
        if: inputs.dry_run == false && steps.v.outputs.released == 'false' && steps.v.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --target "$CANDIDATE_SHA" \
            --title "FastLED ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub release for an existing tag
        if: inputs.dry_run == false && steps.v.outputs.released == 'false' && steps.v.outputs.tagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.version }}" \
            --verify-tag \
            --title "FastLED ${{ steps.v.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

      # Events raised with the workflow token do not trigger other workflows,
      # so the docs build is dispatched rather than left to `on: release`.
      - name: Rebuild the docs
        if: inputs.dry_run == false && steps.v.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs2.yml --ref master -f "release_tag=${{ steps.v.outputs.version }}"
