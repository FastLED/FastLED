name: attiny85

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_attiny85.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  build:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny85') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:attiny*')))
    uses: ./.github/workflows/build_template.yml
    with:
      # RGBWColorimetric hits the SK6812 clockless_blocking timing floor
      # (T3 >= 3 cycles ~= 375ns at 8 MHz, SK6812 T3 = 300ns) — the
      # FL_STATIC_ASSERT in src/platforms/avr/attiny/clockless_blocking.h
      # fires at compile time. Same exclusion applied to attiny88 in
      # #3546. Keep the rest of the sweep.
      args: attiny85 all --exclude-examples RGBWColorimetric
