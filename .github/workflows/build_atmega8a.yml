name: atmega8a

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'examples/**'
      - 'ci/**'
      - '.github/workflows/build_atmega8a.yml'
      - '.github/workflows/build_template.yml'
      - 'CMakeLists.txt'
      - 'platformio.ini'
      - 'library.json'
      - 'library.properties'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
jobs:
  build:
    # Generated by bash ci-labels sync; verify with bash ci-labels check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       (contains(github.event.pull_request.labels.*.name, 'ci-full') ||
        contains(github.event.pull_request.labels.*.name, 'ci-platform:atmega8a')))
    uses: ./.github/workflows/build_template.yml
    with:
      # TwinkleFox does not fit 8KB of flash on an ATmega8: it links at
      # ~9.1KB (1100 B over). It fits the ATtiny85 at 7.85KB only because
      # FL_IS_AVR_LIMITED compiles out colour correction and dithering there
      # and the ATtiny has no UART core; the ATmega8 keeps both. Keep the rest
      # of the sweep.
      args: atmega8a all --exclude-examples TwinkleFox
