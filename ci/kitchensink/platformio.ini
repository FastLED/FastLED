; Builds FastLED against a set of popular ESP32 networking libraries to catch
; header conflicts. fbuild compiles kitchensink.ino.cpp as the sketch and pulls
; FastLED in as a library, the same way the root platformio.ini does.
;
; FS, ArduinoOTA, ESPmDNS and WiFi ship inside the ESP32 Arduino core, so they
; are found from the sketch's #includes and are not listed in lib_deps; naming
; them there sends fbuild to the library registry, which does not carry them.
[platformio]
src_dir = .

[env:dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    FastLED=symlink://../../
    https://github.com/dvarrel/AsyncTCP
    https://github.com/mathieucarbou/ESPAsyncWebServer
    bblanchon/ArduinoJson

lib_ldf_mode=deep
