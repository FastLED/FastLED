    aliases:
      - Dan Garcia
      - focalintent
      - danielgarcia
    always: false
  - name: Mark Kriegsman
    aliases:
      - kriegsman
    always: false
  - name: Zach Vorhies
    aliases:
      - Zackees
      - Zachary Vorhies
    always: true
